name: Deployer
description: Composite action to deploy projects on different AWS services
inputs:
  METHOD:
    required: true
    description: Which method will be used to deliver/deploy the code. 'EC2' delivers and deploys via SSH/SCP. 'ECR' pushes the image to an Amazon ECR repository (DELIVER phase only).
  EC2_IP:
    required: true
    description: IP to connecto to the EC2 server. Ex. ec2-xx-xxx-xxx-x.compute-4.amazonaws.com
  EC2_USER:
    required: true
    description: user to login on EC2 instance
  EC2_KEY:
    required: true
    description: Key to connect to the EC2 Server via SSH
  IMAGE_TAR_PATH:
    required: true
    description: Absolute path to the .tar file with the Docker image to be copied and deployed
  ECR_REPOSITORY:
    required: false
    description: Name of the Amazon ECR repository to push the image to (required when METHOD is 'ECR'). Created automatically if it doesn't exist. AWS credentials/region must already be configured in the job, e.g. via aws-actions/configure-aws-credentials.
  DOCKERFILE_PATH:
    required: false
    description: Relative path to the Dockerfile to parse for ports/networks/volumes (same value passed to action-dockerization)
    default: 'Dockerfile'
  COMPOSE_NAME:
    required: false
    description: Base name for the docker compose file to be created (defaults to the repository name)
  ACTION:
    required: false
    description: "DELIVER copies and loads the new image on the EC2 and prepares the docker compose file, without touching the running service. DEPLOY swaps the running service's container for the already-loaded image and removes the old image. If omitted, both are done in the same run."
outputs:
  IMAGE_URI:
    description: Full URI of the image pushed to ECR (account.dkr.ecr.region.amazonaws.com/repository:tag). Only set when METHOD is 'ECR' and the DELIVER phase ran.
    value: ${{ steps.ecr_deliver.outputs.IMAGE_URI }}
runs:
  using: "composite"
  steps:
    - name: Make scripts executable
      shell: bash
      run: |
        chmod +x ${{ github.action_path }}/scripts/*.sh
        echo "✅ Scripts ready"

    - name: Validate inputs
      id: validate_inputs
      shell: bash
      run: ${{ github.action_path }}/scripts/validate_inputs.sh
      env:
        METHOD: ${{ inputs.METHOD }}
        EC2_IP: ${{ inputs.EC2_IP }}
        EC2_USER: ${{ inputs.EC2_USER }}
        EC2_KEY: ${{ inputs.EC2_KEY }}
        IMAGE_TAR_PATH: ${{ inputs.IMAGE_TAR_PATH }}
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}
        ACTION: ${{ inputs.ACTION }}
        ECR_REPOSITORY: ${{ inputs.ECR_REPOSITORY }}

    - name: Resolve compose file name
      id: dockerfile_config
      shell: bash
      run: ${{ github.action_path }}/scripts/dockerfile_config.sh
      env:
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}
        COMPOSE_NAME: ${{ inputs.COMPOSE_NAME }}
        REQUIRE_DOCKERFILE: ${{ steps.validate_inputs.outputs.ACTION == '' || steps.validate_inputs.outputs.ACTION == 'DELIVER' }}

    - name: Parse ports from Dockerfile
      id: port_formatter
      if: steps.validate_inputs.outputs.ACTION == '' || steps.validate_inputs.outputs.ACTION == 'DELIVER'
      shell: bash
      run: ${{ github.action_path }}/scripts/port_formatter.sh
      env:
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}

    - name: Parse networks from Dockerfile
      id: net_formatter
      if: steps.validate_inputs.outputs.ACTION == '' || steps.validate_inputs.outputs.ACTION == 'DELIVER'
      shell: bash
      run: ${{ github.action_path }}/scripts/net_formatter.sh
      env:
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}

    - name: Parse volumes from Dockerfile
      id: volume_formatter
      if: steps.validate_inputs.outputs.ACTION == '' || steps.validate_inputs.outputs.ACTION == 'DELIVER'
      shell: bash
      run: ${{ github.action_path }}/scripts/volume_formatter.sh
      env:
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}

    - name: Setup SSH connection
      shell: bash
      run: |
        if [ "${{ inputs.METHOD }}" != "EC2" ]; then exit 0; fi

        echo "Setting up SSH to ${{ inputs.EC2_IP }}..."
        echo "${{ inputs.EC2_KEY }}" | tr -d '\r' > server_key.pem
        chmod 600 server_key.pem
        mkdir -p ~/.ssh

        ssh-keyscan -H ${{ inputs.EC2_IP }} >> ~/.ssh/known_hosts 2>&1
        if [ $? -ne 0 ]; then
          echo "❌ ssh-keyscan failed"
          exit 1
        fi

        echo "✅ SSH configured"

    - name: Deliver image to EC2
      if: steps.validate_inputs.outputs.ACTION == '' || steps.validate_inputs.outputs.ACTION == 'DELIVER'
      shell: bash
      run: |
        if [ "${{ inputs.METHOD }}" != "EC2" ]; then exit 0; fi

        if [ ! -f "${{ inputs.IMAGE_TAR_PATH }}" ]; then
          echo "❌ Image file not found: ${{ inputs.IMAGE_TAR_PATH }}"
          exit 1
        fi

        echo "Copying image to EC2..."
        scp -i server_key.pem -o StrictHostKeyChecking=no "${{ inputs.IMAGE_TAR_PATH }}" ${{ inputs.EC2_USER }}@${{ inputs.EC2_IP }}:/root/
        if [ $? -ne 0 ]; then
          echo "❌ SCP failed"
          exit 1
        fi

        echo "Delivering..."
        ssh -i server_key.pem -o StrictHostKeyChecking=no ${{ inputs.EC2_USER }}@${{ inputs.EC2_IP }} \
          "COMPOSE_PORTS='${{ steps.port_formatter.outputs.COMPOSE_PORTS }}' \
          COMPOSE_NETWORKS='${{ steps.net_formatter.outputs.COMPOSE_NETWORKS }}' \
          COMPOSE_VOLUMES='${{ steps.volume_formatter.outputs.COMPOSE_VOLUMES }}' \
          COMPOSE_FILE_NAME='${{ steps.dockerfile_config.outputs.COMPOSE_FILE_NAME }}' \
          IMAGE_NAME='$(basename "${{ inputs.IMAGE_TAR_PATH }}")' \
          bash -s" < ${{ github.action_path }}/scripts/ec2_deliver.sh

        if [ $? -ne 0 ]; then
          echo "❌ Delivery failed"
          exit 1
        fi

        echo "✅ Delivered successfully"

    - name: Deliver image to ECR
      id: ecr_deliver
      if: steps.validate_inputs.outputs.ACTION == '' || steps.validate_inputs.outputs.ACTION == 'DELIVER'
      shell: bash
      run: ${{ github.action_path }}/scripts/ecr_deliver.sh
      env:
        METHOD: ${{ inputs.METHOD }}
        IMAGE_TAR_PATH: ${{ inputs.IMAGE_TAR_PATH }}
        ECR_REPOSITORY: ${{ inputs.ECR_REPOSITORY }}

    - name: Deploy on EC2
      if: steps.validate_inputs.outputs.ACTION == '' || steps.validate_inputs.outputs.ACTION == 'DEPLOY'
      shell: bash
      run: |
        if [ "${{ inputs.METHOD }}" != "EC2" ]; then exit 0; fi

        echo "Deploying..."
        ssh -i server_key.pem -o StrictHostKeyChecking=no ${{ inputs.EC2_USER }}@${{ inputs.EC2_IP }} \
          "COMPOSE_FILE_NAME='${{ steps.dockerfile_config.outputs.COMPOSE_FILE_NAME }}' \
          SERVICE_NAME='$(basename "${{ inputs.IMAGE_TAR_PATH }}" .tar)' \
          bash -s" < ${{ github.action_path }}/scripts/ec2_deploy_run.sh

        if [ $? -ne 0 ]; then
          echo "❌ Deployment failed"
          exit 1
        fi

        echo "✅ Deployed successfully"
